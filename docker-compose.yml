services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "${DATABASE_PORT:-5434}:5432"

  fastapi:
    build: ./fastapi
    env_file: .env
    depends_on:
      - db
      - redis
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
    volumes:
      - ./fastapi:/usr/src/app
      - ./uploads:/usr/src/uploads
      - ./outputs:/usr/src/outputs
    ports:
      - "8000:8000"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  streamlit:
    build: ./streamlit
    env_file: .env
    volumes:
      - ./streamlit:/usr/src/streamlit
    ports:
      - "8501:8501"
    command: ["streamlit", "run", "app.py", "--server.port=8501", "--server.address=0.0.0.0"]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  migrate:
    profiles: ["migration"]
    build: ./fastapi
    env_file: .env
    depends_on:
      - db
    working_dir: /usr/src/app
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
    volumes:
      - ./fastapi:/usr/src/app
    entrypoint: ["alembic", "-c", "alembic.ini", "upgrade", "head"]

volumes:
  db-data: